name: telemicro-local
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: telemicro
      POSTGRES_USER: telemicro
      POSTGRES_PASSWORD: telemicro_local_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemicro -d telemicro"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
